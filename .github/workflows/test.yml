name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    env:
      # Safe fake only. The test suite never calls the real Figma API and
      # does not require a valid FIGMA_TOKEN to pass; this exists purely as
      # a defensive placeholder in case any test path checks for presence.
      FIGMA_TOKEN: ci-placeholder-token
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
